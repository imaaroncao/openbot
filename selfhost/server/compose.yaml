# Self-hosted OpenBot server: everything the desktop and phone apps need, on one VPS.
#
#   caddy      HTTPS for both names (Let's Encrypt, HTTP-01), reverse proxy
#   auth-api   the account service (the upstream Cloudflare Worker, run by workerd, data in ./data)
#   signal     Signal: WebSocket signaling for remote access (upstream remote/api)
#   coturn     TURN relay for WebRTC when a direct connection is not possible
#
# Start:  docker compose --env-file .env up -d --build      (selfhost/server/scripts/deploy.sh does it)
# The build context is the repository root, so the upstream Dockerfiles are used as they are.
name: openbot-selfhost

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      SIGNAL_DOMAIN: ${SIGNAL_DOMAIN:?SIGNAL_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - auth-api
      - signal

  auth-api:
    build:
      context: ../..
      dockerfile: selfhost/server/auth-api/Dockerfile
    restart: unless-stopped
    env_file: ${SELFHOST_ENV_FILE:-.env}
    environment:
      AUTH_API_PUBLIC_ORIGIN: https://${API_DOMAIN}
      REMOTE_SIGNAL_URL: wss://${SIGNAL_DOMAIN}/v1/signal
      # Inside the Compose network: the auth events go straight to Signal.
      REMOTE_AUTH_WEBHOOK_URL: http://signal:8443/internal/auth-events
    volumes:
      - ./data/auth-api:/data
    expose:
      - "8787"

  signal:
    build:
      context: ../..
      dockerfile: remote/api/Dockerfile
      args:
        OPENBOT_SOURCE_COMMIT: ${OPENBOT_SOURCE_COMMIT:-selfhost}
    restart: unless-stopped
    environment:
      REMOTE_SIGNAL_HOST: 0.0.0.0
      REMOTE_SIGNAL_PORT: 8443
      REMOTE_HEALTH_HOST: 0.0.0.0
      REMOTE_HEALTH_PORT: 8080
      # Caddy terminates TLS in front of Signal.
      REMOTE_TLS_DISABLED: "true"
      REMOTE_TRUST_PROXY: "true"
      REMOTE_TICKET_PUBLIC_KEYS: ${REMOTE_TICKET_PUBLIC_JWKS:?run scripts/init-secrets.sh}
      # Inside the Compose network, so no request leaves the VPS and comes back (no NAT hairpin).
      REMOTE_CONTROL_PLANE_URL: http://auth-api:8787
      REMOTE_SESSION_SECRET: ${REMOTE_SESSION_SECRET:?run scripts/init-secrets.sh}
      REMOTE_AUTH_WEBHOOK_SECRET: ${REMOTE_AUTH_WEBHOOK_SECRET:?run scripts/init-secrets.sh}
      REMOTE_METRICS_TOKEN: ${REMOTE_METRICS_TOKEN:?run scripts/init-secrets.sh}
      REMOTE_MAX_CONNECTIONS_PER_USER: ${REMOTE_MAX_CONNECTIONS_PER_USER:-32}
      REMOTE_MAX_CONNECTIONS_PER_IP: ${REMOTE_MAX_CONNECTIONS_PER_IP:-32}
      REMOTE_MAX_MESSAGES_PER_MINUTE: ${REMOTE_MAX_MESSAGES_PER_MINUTE:-600}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?run scripts/init-secrets.sh}
      TURN_HOST: ${TURN_DOMAIN:-${SIGNAL_DOMAIN}}
      TURN_PORT: 3478
      TURN_TLS_PORT: 5349
      # Slack, Discord and Telegram relays need the vendor's apps; they stay off. GitHub uses your
      # own app (selfhost/scripts/create-github-app.sh writes its webhook secret to .env).
      SLACK_SIGNING_SECRET: ""
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      DISCORD_BOT_TOKEN: ""
      DISCORD_APPLICATION_ID: ""
      TELEGRAM_BOT_TOKENS: ""
    expose:
      - "8443"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  coturn:
    build:
      context: ../..
      dockerfile: remote/coturn/Dockerfile
    restart: unless-stopped
    # TURN needs many UDP relay ports; host networking avoids a huge port list.
    network_mode: host
    environment:
      # `public/private` on a VPS behind 1:1 NAT (Oracle Cloud, AWS): deploy.sh finds the private IP.
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?TURN_PUBLIC_IP is required}${TURN_PRIVATE_IP:+/${TURN_PRIVATE_IP}}
      TURN_REALM: ${TURN_DOMAIN:-${SIGNAL_DOMAIN}}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?run scripts/init-secrets.sh}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
    volumes:
      # Upstream's remote/coturn/turnserver.conf plus `relay-ip`, written by deploy.sh. With host
      # networking coturn sees the Docker bridges too, and without a fixed relay address it can
      # hand out a bridge address that no client reaches.
      - ./data/coturn.conf:/etc/coturn/openbot.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
