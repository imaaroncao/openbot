# Self-hosted fork: the always-on OpenBot host on the VPS. Its agents, embedded browser and
# Computer Use run on virtual displays inside the container; you use them from the desktop app,
# the phone, and remote desktop. The image comes from scripts/build-linux-host.sh.
#
# Copied to /opt/openbot-host/compose.yaml by scripts/deploy-host.sh, next to seccomp.json.
name: openbot-host

services:
  openbot:
    image: openbot-selfhost-host:latest
    restart: unless-stopped
    # Upstream's profile: Docker's default plus user namespaces, so the Electron sandbox stays on.
    security_opt:
      - seccomp=./seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    environment:
      OPENBOT_AUTH_API_URL: https://${API_DOMAIN:?API_DOMAIN is required}
      OPENBOT_REMOTE_SIGNAL_URL: wss://${SIGNAL_DOMAIN:?SIGNAL_DOMAIN is required}/v1/signal
      OPENBOT_DISPLAY_SIZE: ${OPENBOT_DISPLAY_SIZE:-1280x800}
      # Your own GitHub App (selfhost/scripts/create-github-app.sh). Empty: no GitHub connection.
      OPENBOT_GITHUB_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      OPENBOT_GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
    volumes:
      - openbot-data:/data
    # A fixed address: the TURN server (scripts/deploy.sh) relays to this one private address only.
    networks:
      openbot:
        ipv4_address: 172.31.250.10

networks:
  openbot:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  openbot-data:
